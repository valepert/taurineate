# Builds a universal macOS .dmg when a version tag (v0.1.0, ...) is pushed
# and attaches it to a draft GitHub Release, to be published by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: taurineate ${{ github.ref_name }}
          releaseBody: |
            Universal build for Apple Silicon and Intel Macs (macOS 10.13+).

            1. Open the .dmg and drag taurineate to Applications.
            2. Install the tracers: `brew install potrace autotrace`
            3. The app isn't notarized, so the first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway**.
          releaseDraft: true
          args: --target universal-apple-darwin --bundles app,dmg
